
name: Build BioNexa Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build BioNexa debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK manager was not found."
            exit 1
          fi
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | "$SDKMANAGER" --licenses || true

      - name: Install dependencies
        run: npm install

      - name: Validate source files
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -f index.html
          test -f src/main.js
          test -f src/formulas.js
          test -f src/style.css
          test -f assets/icon.png
          test -f assets/icon-foreground.png
          node --check src/main.js
          node --check src/formulas.js

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Apply BioNexa app name and icon
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/apply_android_branding.py

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BioNexa-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
