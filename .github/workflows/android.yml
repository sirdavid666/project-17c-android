
name: Build BioNexa Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build BioNexa debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "Using SDK manager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Diagnose and validate source files
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Repository root contents:"
          ls -la

          echo ""
          echo "Checking required files..."

          MISSING=0

          for file in \
            package.json \
            capacitor.config.json \
            index.html \
            src/main.js \
            src/formulas.js \
            src/style.css \
            assets/icon.png \
            assets/icon-foreground.png \
            scripts/apply_android_branding.py
          do
            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
              MISSING=1
            fi
          done

          if [ "$MISSING" -ne 0 ]; then
            echo "ERROR: One or more required files are missing from the repository root."
            exit 1
          fi

          echo ""
          echo "Checking JavaScript syntax..."
          node --check src/main.js
          node --check src/formulas.js

          echo "All required files were found."

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Apply BioNexa app name and icon
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/apply_android_branding.py

      - name: Fix duplicate launcher background resource
        run: |
          VALUES_DIR="android/app/src/main/res/values"
          DUPLICATE_FILE="$VALUES_DIR/ic_launcher_background.xml"
          COLORS_FILE="$VALUES_DIR/colors.xml"

          if [ -f "$DUPLICATE_FILE" ] && [ -f "$COLORS_FILE" ]; then
            if grep -q 'name="ic_launcher_background"' "$COLORS_FILE"; then
              echo "Duplicate ic_launcher_background color found."
              echo "Removing the separate resource file to avoid the merge conflict."
              rm "$DUPLICATE_FILE"
            else
              echo "No duplicate color definition found in colors.xml."
            fi
          elif [ -f "$DUPLICATE_FILE" ]; then
            echo "Keeping launcher background resource because colors.xml is absent."
          else
            echo "No separate launcher background resource file found."
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BioNexa-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
